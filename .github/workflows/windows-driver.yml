# Windows L2CAP driver: build with /analyze, InfVerif, test signing (contributed by henningnorden).
# The report and the test-signed driver go to the vm-results branch of the fork, so the
# Windows test VM gets them with plain git. Nothing is pushed anywhere else.
# Actions are pinned to commits; the tag in the comment is what the commit was when pinned.
name: windows-driver

on:
  push:
    branches: [windows-l2cap-driver]
    paths:
      - "windows/**"
      - ".github/workflows/windows-driver.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build, analyze, InfVerif, sign
        shell: pwsh
        run: |
          $short = $env:GITHUB_SHA.Substring(0, 7)
          ./windows/driver/build.ps1 -OutDir windows/driver/out -Title "run $env:GITHUB_RUN_NUMBER, commit $short"
          exit $LASTEXITCODE
      - name: Keep report and driver
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows-driver
          path: |
            windows/driver/out/report.md
            windows/driver/out/status.txt
            windows/driver/out/driver.zip
          if-no-files-found: warn

  publish:
    needs: build
    if: always() && github.repository == 'henningnorden/mousepods'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: vm-results
      - name: Fetch report and driver
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: windows-driver
          path: incoming
      - name: Commit to vm-results
        shell: bash
        env:
          RUN: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          BUILD_RESULT: ${{ needs.build.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          short=${SHA::7}
          report="ci/$RUN-$short.md"
          mkdir -p ci
          if [ -f incoming/report.md ]; then
            cp incoming/report.md "$report"
          else
            printf '# Windows driver build: run %s, commit %s\n\nStatus: **failure**\n\nThe build job ended (%s) without a report.\n' \
              "$RUN" "$short" "$BUILD_RESULT" > "$report"
          fi
          printf '\nCommit %s, build job %s, %s\n' "$SHA" "$BUILD_RESULT" "$RUN_URL" >> "$report"
          if [ -f incoming/driver.zip ]; then
            mkdir -p "ci/$short"
            cp incoming/driver.zip "ci/$short/driver.zip"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci
          git commit -m "Driver build $RUN for $short: $(cat incoming/status.txt 2>/dev/null || echo failure)"
          for attempt in 1 2 3; do
            git fetch origin vm-results && git pull --rebase origin vm-results && git push origin HEAD:vm-results && exit 0
            sleep $((attempt * 5))
          done
          exit 1
