# Windows L2CAP driver: build with /analyze, InfVerif, test signing (contributed by henningnorden).
# The report and the test-signed driver go to the vm-results branch of the fork, so the
# Windows test VM gets them with plain git. Nothing is pushed anywhere else.
# Actions are pinned to commits; the tag in the comment is what the commit was when pinned.
name: windows-driver

on:
  push:
    branches: [windows-l2cap-driver]
    paths:
      - "windows/**"
      - "windows/vm/**"
      - "l2cap_win.py"
      - "tests/test_run_variants.py"
      - "tests/test_l2cap_win.py"
      - "tests/test_windows_headtrack.py"
      - ".github/workflows/windows-driver.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build, analyze, InfVerif, sign
        shell: pwsh
        run: |
          $short = $env:GITHUB_SHA.Substring(0, 7)
          ./windows/driver/build.ps1 -OutDir windows/driver/out -Title "run $env:GITHUB_RUN_NUMBER, commit $short"
          exit $LASTEXITCODE
      - name: Keep report and driver
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows-driver
          path: |
            windows/driver/out/report.md
            windows/driver/out/status.txt
            windows/driver/out/driver.zip
          if-no-files-found: warn

  # The VM round scripts: they run in Windows PowerShell 5.1 on the test VM, and pwsh is not
  # available where they are written, so they are parsed and their C# compiled here.
  vm-scripts:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Parse the PowerShell scripts (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $failed = $false
          foreach ($f in Get-ChildItem windows/vm/*.ps1, windows/driver/*.ps1) {
            $rel = $f.FullName.Substring($PWD.Path.Length + 1) -replace '\\', '/'
            $tokens = $null; $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errs)
            foreach ($e in $errs) {
              $failed = $true
              Write-Host "::error file=$rel,line=$($e.Extent.StartLineNumber),col=$($e.Extent.StartColumnNumber),title=PowerShell parse error::$($e.Message)"
            }
            if (-not $errs) { Write-Host "parsed: $rel" }
          }
          if (Get-Module -ListAvailable PSScriptAnalyzer) {
            $skip = 'PSAvoidUsingWriteHost', 'PSUseApprovedVerbs', 'PSUseShouldProcessForStateChangingFunctions', 'PSUseSingularNouns', 'PSAvoidUsingPositionalParameters'
            foreach ($d in Invoke-ScriptAnalyzer -Path windows/vm -Severity Error, Warning -ExcludeRule $skip | Sort-Object Severity -Descending) {
              $rel = $d.ScriptPath.Substring($PWD.Path.Length + 1) -replace '\\', '/'
              $level = 'warning'
              if ("$($d.Severity)" -eq 'Error') { $level = 'error'; $failed = $true }
              Write-Host "::$level file=$rel,line=$($d.Line),title=$($d.RuleName)::$($d.Message -replace '[\r\n]+', ' ')"
            }
          } else { Write-Host 'PSScriptAnalyzer not installed; parse check only' }
          if ($failed) { exit 1 }
      - name: Compile the C# helpers (round.ps1 -SelfTest)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File windows/vm/round.ps1 -SelfTest 2>&1 | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            Write-Host "::error file=windows/vm/round.ps1,title=round.ps1 -SelfTest::exit ${code}: $(($out | Select-Object -Last 5) -join ' / ')"
            exit 1
          }
      - name: Python side on Windows (selftest, unit tests)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = & python windows/vm/run_variants.py selftest 2>&1 | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            Write-Host "::error file=windows/vm/run_variants.py,title=run_variants selftest::exit ${code}: $(($out | Select-Object -Last 5) -join ' / ')"
            exit 1
          }
          $failed = $false
          foreach ($t in 'test_run_variants', 'test_l2cap_win', 'test_windows_headtrack') {
            $out = & python -m unittest "tests.$t" 2>&1 | ForEach-Object { "$_" }
            $code = $LASTEXITCODE
            $out | ForEach-Object { Write-Host $_ }
            if ($code -ne 0) {
              $fails = ($out | Where-Object { $_ -match '^(FAIL|ERROR):|Error:' } | Select-Object -First 6) -join ' / '
              Write-Host "::error file=tests/$t.py,title=unit tests on Windows::$fails"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

  publish:
    needs: build
    if: always() && github.repository == 'henningnorden/mousepods'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: vm-results
      - name: Fetch report and driver
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: windows-driver
          path: incoming
      - name: Commit to vm-results
        shell: bash
        env:
          RUN: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          BUILD_RESULT: ${{ needs.build.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          short=${SHA::7}
          report="ci/$RUN-$short.md"
          mkdir -p ci
          if [ -f incoming/report.md ]; then
            cp incoming/report.md "$report"
          else
            printf '# Windows driver build: run %s, commit %s\n\nStatus: **failure**\n\nThe build job ended (%s) without a report.\n' \
              "$RUN" "$short" "$BUILD_RESULT" > "$report"
          fi
          printf '\nCommit %s, build job %s, %s\n' "$SHA" "$BUILD_RESULT" "$RUN_URL" >> "$report"
          if [ -f incoming/driver.zip ]; then
            mkdir -p "ci/$short"
            cp incoming/driver.zip "ci/$short/driver.zip"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci
          git commit -m "Driver build $RUN for $short: $(cat incoming/status.txt 2>/dev/null || echo failure)"
          for attempt in 1 2 3; do
            git fetch origin vm-results && git pull --rebase origin vm-results && git push origin HEAD:vm-results && exit 0
            sleep $((attempt * 5))
          done
          exit 1
